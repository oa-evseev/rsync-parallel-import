[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rsync-parallel-import"
version = "1.0.0"
description = "A persistent, resumable, byte-balanced parallel rsync controller"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "rsync-parallel-import contributors"}]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Archiving :: Backup",
]
dependencies = []

[project.scripts]
rsync-parallel-import = "rsync_parallel_import.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/doc/rsync-parallel-import/examples" = ["examples/rsync-parallel-import.toml"]
"share/doc/rsync-parallel-import/systemd" = ["systemd/rsync-parallel-import.service"]

